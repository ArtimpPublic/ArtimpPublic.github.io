<!DOCTYPE html>
<html lang="es-CO">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Demo Menú Digital QR — La Brasa Cali | Creado por ARTIMP Publicidad</title>
  <meta name="description" content="Prueba en vivo cómo funciona un Menú Digital QR creado por ARTIMP Publicidad Cali con carrito y pedidos directos a WhatsApp." />
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #08090d;
      --card: #12151f;
      --border: rgba(255,255,255,0.09);
      --gold: #f5c542;
      --cyan: #00e5ff;
      --wa: #25d366;
      --text: #f5f7fb;
      --muted: #98a2b3;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(600px 300px at 50% 0%, rgba(245,197,66,0.14), transparent 70%), var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      padding-bottom: 110px;
    }
    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }

    .artimp-bar {
      background: linear-gradient(90deg, #0b162c, #111b30);
      border-bottom: 1px solid rgba(0,229,255,0.28);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 0.78rem;
      position: sticky;
      top: 0;
      z-index: 60;
      backdrop-filter: blur(12px);
    }
    .artimp-bar a.cta-mini {
      background: var(--gold);
      color: #090c14;
      font-weight: 800;
      padding: 6px 12px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .wrap { max-width: 560px; margin: 0 auto; padding: 20px 16px; }

    .rest-header {
      text-align: center;
      padding: 18px 14px 22px;
      border-radius: 22px;
      background: linear-gradient(180deg, rgba(245,197,66,0.1), rgba(18,21,31,0.9));
      border: 1px solid rgba(245,197,66,0.28);
      margin-bottom: 18px;
    }
    .rest-badge {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(37,211,102,0.16);
      color: #7df7aa;
      margin-bottom: 8px;
    }
    .rest-header h1 {
      font-family: 'Syne', sans-serif;
      font-size: 1.75rem;
      letter-spacing: 0.02em;
      color: #fff;
    }
    .rest-header p { font-size: 0.85rem; color: var(--muted); margin-top: 4px; }

    .cats {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 16px;
      scrollbar-width: none;
    }
    .cats::-webkit-scrollbar { display: none; }
    .cat-btn {
      padding: 9px 16px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--muted);
      font-weight: 700;
      font-size: 0.84rem;
      white-space: nowrap;
      transition: all 0.2s ease;
    }
    .cat-btn.active {
      background: var(--gold);
      color: #090c14;
      border-color: var(--gold);
    }

    .menu-list { display: flex; flex-direction: column; gap: 12px; }
    .dish {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
    }
    .dish-info { flex: 1; }
    .dish-tag {
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--cyan);
      letter-spacing: 0.08em;
    }
    .dish h3 { font-size: 1rem; margin: 2px 0 4px; }
    .dish p { font-size: 0.8rem; color: var(--muted); line-height: 1.4; }
    .dish-price {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--gold);
      margin-top: 6px;
    }

    .qty-ctrl {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 4px;
    }
    .qty-btn {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: rgba(255,255,255,0.08);
      font-weight: 800;
      font-size: 1rem;
      display: grid;
      place-items: center;
    }
    .qty-btn.add { background: var(--gold); color: #090c14; }
    .qty-num { min-width: 18px; text-align: center; font-weight: 700; font-size: 0.88rem; }

    .cart-bar {
      position: fixed;
      left: 14px;
      right: 14px;
      bottom: 14px;
      max-width: 532px;
      margin: 0 auto;
      background: linear-gradient(135deg, #2ee672, #18a84b);
      color: #04130a;
      border-radius: 18px;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      box-shadow: 0 16px 40px -8px rgba(37,211,102,0.55);
      transform: translateY(140%);
      transition: transform 0.3s cubic-bezier(0.22,1,0.36,1);
      z-index: 70;
    }
    .cart-bar.visible { transform: translateY(0); }
    .cart-bar strong { display: block; font-size: 0.94rem; }
    .cart-bar small { font-size: 0.76rem; font-weight: 600; opacity: 0.85; }
    .cart-send {
      background: #06180d;
      color: #fff;
      font-weight: 800;
      font-size: 0.84rem;
      padding: 10px 14px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.84rem;
      color: var(--cyan);
      margin-bottom: 14px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="artimp-bar">
    <span>✦ <strong>Demo Interactiva</strong> creada por ARTIMP Publicidad</span>
    <a class="cta-mini" href="https://wa.me/573167283557?text=%C2%A1Hola%20ARTIMP!%20Prob%C3%A9%20la%20demo%20del%20Men%C3%BA%20Digital%20QR%20y%20quiero%20uno%20para%20mi%20negocio." target="_blank" rel="noopener">Quiero este menú</a>
  </div>

  <main class="wrap">
    <a class="back-link" href="index.html">← Volver a ARTIMP Publicidad</a>

    <header class="rest-header">
      <span class="rest-badge">● Demo en vivo · Pedidos a WhatsApp</span>
      <h1>LA BRASA CALI</h1>
      <p>Hamburguesas artesanales &amp; parrilla · Cali, Valle</p>
    </header>

    <div class="cats" id="cats">
      <button class="cat-btn active" data-cat="all">Todos</button>
      <button class="cat-btn" data-cat="burgers">Hamburguesas</button>
      <button class="cat-btn" data-cat="parrilla">Parrilla</button>
      <button class="cat-btn" data-cat="bebidas">Bebidas</button>
    </div>

    <div class="menu-list" id="menuList"></div>
  </main>

  <div class="cart-bar" id="cartBar">
    <div>
      <strong id="cartCount">0 productos · $0</strong>
      <small>Pedido listo para enviar por WhatsApp</small>
    </div>
    <button class="cart-send" id="cartSend">Enviar Pedido →</button>
  </div>

  <script>
    const ITEMS = [
      { id: 1, cat: 'burgers', tag: '★ Más pedida', name: 'Burger Doble Cheddar', desc: '240g carne angus a la brasa, doble queso cheddar, tocineta ahumada y salsa de la casa.', price: 26000 },
      { id: 2, cat: 'burgers', tag: 'Recomendada', name: 'Crispy Pollo Miel Mostaza', desc: 'Pechuga apanada crujiente, lechuga fresca, pepinillos y pan brioche artesanal.', price: 22000 },
      { id: 3, cat: 'parrilla', tag: 'Especialidad', name: 'Costillas BBQ 400g', desc: 'Cocción lenta 6 horas en salsa BBQ artesanal + papas criollas y ensalada fresca.', price: 38000 },
      { id: 4, cat: 'parrilla', tag: 'Para compartir', name: 'Picada Caleña x2', desc: 'Chicharrón crocante, chorizo artesanal, carne asada, patacones y guacamole.', price: 46000 },
      { id: 5, cat: 'bebidas', tag: 'Refrescante', name: 'Limonada de Coco', desc: 'Natural, granizada y cremosa, preparada al instante.', price: 11000 },
      { id: 6, cat: 'bebidas', tag: 'Fría', name: 'Soda Italiana Frutos Rojos', desc: 'Con frutos rojos macerados, hierbabuena y hielo cristal.', price: 10000 }
    ];

    const cart = {};
    let activeCat = 'all';
    const menuList = document.getElementById('menuList');
    const cartBar = document.getElementById('cartBar');
    const cartCount = document.getElementById('cartCount');
    const formatCOP = (n) => '$' + n.toLocaleString('es-CO');

    function render() {
      const filtered = activeCat === 'all' ? ITEMS : ITEMS.filter(i => i.cat === activeCat);
      menuList.innerHTML = filtered.map(item => {
        const q = cart[item.id] || 0;
        return `
          <article class="dish">
            <div class="dish-info">
              <span class="dish-tag">${item.tag}</span>
              <h3>${item.name}</h3>
              <p>${item.desc}</p>
              <div class="dish-price">${formatCOP(item.price)}</div>
            </div>
            <div class="qty-ctrl">
              ${q > 0 ? `<button class="qty-btn" onclick="changeQty(${item.id}, -1)">−</button><span class="qty-num">${q}</span>` : ''}
              <button class="qty-btn add" onclick="changeQty(${item.id}, 1)">+</button>
            </div>
          </article>
        `;
      }).join('');
      updateCart();
    }

    window.changeQty = (id, delta) => {
      cart[id] = Math.max(0, (cart[id] || 0) + delta);
      if (cart[id] === 0) delete cart[id];
      render();
    };

    function updateCart() {
      let total = 0, count = 0;
      for (const [id, q] of Object.entries(cart)) {
        const item = ITEMS.find(i => i.id === Number(id));
        if (item) { total += item.price * q; count += q; }
      }
      cartCount.textContent = `${count} ${count === 1 ? 'producto' : 'productos'} · ${formatCOP(total)}`;
      cartBar.classList.toggle('visible', count > 0);
    }

    document.getElementById('cats').addEventListener('click', (e) => {
      const btn = e.target.closest('.cat-btn');
      if (!btn) return;
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeCat = btn.dataset.cat;
      render();
    });

    document.getElementById('cartSend').addEventListener('click', () => {
      let total = 0;
      const lines = [];
      for (const [id, q] of Object.entries(cart)) {
        const item = ITEMS.find(i => i.id === Number(id));
        if (item) {
          total += item.price * q;
          lines.push(`• ${q}x ${item.name} (${formatCOP(item.price * q)})`);
        }
      }
      const msg = `¡Hola! Probé la *Demo de Menú Digital QR de ARTIMP* con este pedido de prueba:\n\n${lines.join('\n')}\n\n*Total demo:* ${formatCOP(total)} COP\n\nMe interesa implementar un menú así para mi negocio.`;
      window.open(`https://wa.me/573167283557?text=${encodeURIComponent(msg)}`, '_blank', 'noopener');
    });

    render();
  </script>
</body>
</html>
